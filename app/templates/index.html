<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZikZik AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0b0f14;
            color: #f1f5f9;

            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 420px;
        }

        .logo {
            font-size: 22px;
            margin-bottom: 10px;
            color: #8b9cff;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }

        .subtitle {
            margin: 7px 0 28px;
            color: #7d8796;
            font-size: 13px;
        }

        .mic {
            width: 72px;
            height: 72px;

            border-radius: 50%;
            border: 1px solid #303846;

            background: #171d26;
            color: white;

            font-size: 27px;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .mic:hover {
            background: #202936;
            transform: scale(1.04);
        }

        .mic.listening {
            background: #5865f2;
            border-color: #7180ff;
            box-shadow: 0 0 0 10px rgba(88, 101, 242, 0.08);
        }

        .status {
            margin-top: 18px;
            color: #7d8796;
            font-size: 13px;
            min-height: 18px;
        }

        .command {
            margin-top: 8px;
            color: #e2e8f0;
            font-size: 15px;
            min-height: 22px;
        }

        .player {
            margin-top: 25px;
            border-radius: 10px;
            overflow: hidden;
        }

        .player iframe {
            width: 100%;
            height: 230px;
            border: 0;
        }

        .hint {
            margin-top: 28px;
            color: #4f5968;
            font-size: 12px;
        }
    </style>
</head>


<body>

    <div class="container">

        <div class="logo">✦</div>

        <h1>ZikZik AI</h1>

        <p class="subtitle">
            Your voice assistant
        </p>

        <button
            id="mic"
            class="mic"
            type="button"
        >
            🎙️
        </button>

        <div id="status" class="status">
            Tap to speak
        </div>

        <div id="command" class="command"></div>

        <div
            id="player"
            class="player"
            style="display:none;"
        ></div>

        <div class="hint">
            Try saying "play Believer"
        </div>

    </div>


<script>

const mic = document.getElementById("mic");
const status = document.getElementById("status");
const command = document.getElementById("command");
const player = document.getElementById("player");


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.textContent =
        "Use Google Chrome for voice input.";

    mic.disabled = true;

}


if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;


    // Microphone clicked

    mic.addEventListener("click", () => {

        recognition.start();

        mic.classList.add("listening");

        status.textContent =
            "Listening...";

        command.textContent = "";

    });


    // Speech received

    recognition.onresult = async (event) => {

        const text =
            event.results[0][0]
                .transcript
                .trim();


        command.textContent =
            `"${text}"`;

        status.textContent =
            "Thinking...";


        try {

            const response =
                await fetch(
                    "/youtube/play",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            command: text
                        })
                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                status.textContent =
                    data.message;

                return;
            }


            status.textContent =
                "Playing";


            player.style.display =
                "block";


            player.innerHTML = `
                <iframe
                    src="${data.url}"
                    allow="autoplay; encrypted-media"
                    allowfullscreen>
                </iframe>
            `;

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "Connection error.";

        }

    };


    recognition.onend = () => {

        mic.classList.remove(
            "listening"
        );

    };


    recognition.onerror = (event) => {

        mic.classList.remove(
            "listening"
        );

        status.textContent =
            "Error: " + event.error;

    };

}

</script>

</body>

</html>
